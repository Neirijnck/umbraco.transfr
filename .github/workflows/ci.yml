name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Client checks, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # A major version rather than global.json: global.json carries comments, and its own roll-forward rule still
      # decides which installed band builds.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/Neirijnck.Transfr/Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Neirijnck.Transfr/Client/package-lock.json

      - name: Install client dependencies
        working-directory: src/Neirijnck.Transfr/Client
        run: npm ci

      - name: Client format check
        working-directory: src/Neirijnck.Transfr/Client
        run: npm run format:check

      - name: Client type check
        working-directory: src/Neirijnck.Transfr/Client
        run: npm run typecheck

      - name: Client lint
        working-directory: src/Neirijnck.Transfr/Client
        run: npm run lint

      - name: Client unit tests
        working-directory: src/Neirijnck.Transfr/Client
        run: npm test

      - name: Restore
        run: dotnet restore Neirijnck.Transfr.slnx --locked-mode

      # Builds the client bundle too (npm run build inside the package project).
      - name: Build
        run: dotnet build Neirijnck.Transfr.slnx --configuration Release --no-restore --nologo

      - name: Unit tests
        run: dotnet test Neirijnck.Transfr.slnx --configuration Release --no-build

  publish:
    name: Publish to nuget.org
    # Only on a release tag (vX.Y.Z), after every gate is green.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Trusted Publishing: GitHub issues an OIDC token that nuget.org exchanges for a one-hour API key, so no
      # long-lived key is stored anywhere. The nuget.org policy names this repository and this file (ci.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/Neirijnck.Transfr/Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Neirijnck.Transfr/Client/package-lock.json

      # A tag that doesn't match the version would publish the wrong number, and a version can never be replaced.
      - name: Check the tag matches the package version
        run: |
          version="$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' src/Neirijnck.Transfr/Neirijnck.Transfr.csproj)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VersionPrefix ${version}."
            exit 1
          fi

      - name: Restore
        run: dotnet restore src/Neirijnck.Transfr/Neirijnck.Transfr.csproj --locked-mode

      # Installs the client's packages and builds the bundle before packing.
      - name: Pack
        run: dotnet pack src/Neirijnck.Transfr/Neirijnck.Transfr.csproj --configuration Release --no-restore --output artifacts

      # Requested just before the push: the key it returns is valid for an hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate: pushing a version that already exists must fail, not pass silently.
      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json