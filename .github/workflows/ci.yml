name: CI

on:
  push:
    # master holds the newest Umbraco major, feature/NN the line for Umbraco NN (Transfr NN.x). A tag vX.Y.Z publishes.
    branches: [master, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are named, not ubuntu-latest: that label moves to a new image over weeks, so runs would switch images
# without a change here. Move the label on deliberately.
jobs:
  build:
    name: Client checks, build and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # A major version rather than global.json: global.json carries comments, and its own roll-forward rule still
      # decides which installed band builds.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/Neirijnck.Transfr/Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Neirijnck.Transfr/Client/package-lock.json

      - name: Install client dependencies
        working-directory: src/Neirijnck.Transfr/Client
        run: npm ci

      - name: Client format check
        working-directory: src/Neirijnck.Transfr/Client
        run: npm run format:check

      - name: Client type check
        working-directory: src/Neirijnck.Transfr/Client
        run: npm run typecheck

      - name: Client lint
        working-directory: src/Neirijnck.Transfr/Client
        run: npm run lint

      - name: Client unit tests
        working-directory: src/Neirijnck.Transfr/Client
        run: npm test

      - name: Restore
        run: dotnet restore Neirijnck.Transfr.slnx --locked-mode

      # Builds the client bundle too (npm run build inside the package project).
      - name: Build
        run: dotnet build Neirijnck.Transfr.slnx --configuration Release --no-restore --nologo

      - name: Unit tests
        run: dotnet test Neirijnck.Transfr.slnx --configuration Release --no-build

  publish:
    name: Publish to nuget.org
    # Only for a version tag (vX.Y.Z, pushed or made with a GitHub release), after every gate is green.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      # The GitHub release.
      contents: write
      # Trusted Publishing: GitHub issues an OIDC token that nuget.org exchanges for a one-hour API key, so no
      # long-lived key is stored anywhere. The nuget.org policy names this repository and this file (ci.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # A version can never be replaced on nuget.org, so a wrong number must stop here: the tag is the version, and
      # the version's major is the Umbraco major of the tagged commit (v17.x.y comes from feature/17, for Umbraco 17).
      - name: Check the tag against the version
        id: version
        run: |
          version="$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' src/Neirijnck.Transfr/Neirijnck.Transfr.csproj)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VersionPrefix ${version}."
            exit 1
          fi
          umbraco_major="$(grep -oPm1 'Include="Umbraco.Cms.Web.Common" Version="\[\K[0-9]+' Directory.Packages.props)"
          if [ "${version%%.*}" != "${umbraco_major}" ]; then
            echo "::error::Version ${version} is not for Umbraco ${umbraco_major}: the major must be the Umbraco major."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The version's section in CHANGELOG.md is its release note; a release without one stops here.
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [${VERSION}]" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/Neirijnck.Transfr/Client/.nvmrc
          cache: npm
          cache-dependency-path: src/Neirijnck.Transfr/Client/package-lock.json

      - name: Restore
        run: dotnet restore src/Neirijnck.Transfr/Neirijnck.Transfr.csproj --locked-mode

      # Installs the client's packages and builds the bundle before packing.
      - name: Pack
        run: >-
          dotnet pack src/Neirijnck.Transfr/Neirijnck.Transfr.csproj --configuration Release --no-restore --output artifacts
          "-p:PackageReleaseNotes=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

      # Requested just before the push: the key it returns is valid for an hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate: pushing a version that already exists must fail, not pass silently.
      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      # A release made by hand in GitHub (which also made the tag) is left as it is. An older major (17.x once 18.x
      # exists) is not marked as the latest release.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists."
            exit 0
          fi
          newest_major="$(curl -fsS https://api.nuget.org/v3-flatcontainer/neirijnck.transfr/index.json | grep -oP '"\K[0-9]+(?=\.)' | sort -n | tail -1)"
          latest=true
          if [ "${VERSION%%.*}" -lt "${newest_major:-0}" ]; then
            latest=false
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Transfr ${VERSION}" --notes-file release-notes.md --latest="${latest}"